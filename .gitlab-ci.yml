stages:
  - build
  - release

variables:
  APPIMAGE_OUTPUT: "build/linux/x64/release/towdow_app.AppImage"
  APK_OUTPUT: "build/app/outputs/flutter-apk/app-release.apk"

build_appimage:
  stage: build
  image: ghcr.io/gmeligio/flutter-android:3.32.5
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apt-get update && apt-get install -y fuse libfuse2 desktop-file-utils
    - CI_COMMIT_TAG_CLEAN=$(echo $CI_COMMIT_TAG | sed 's/^v//')
  script:
    - bash scripts/linux/build_app_image.sh $CI_COMMIT_TAG_CLEAN $CI_PIPELINE_IID
  artifacts:
    paths:
      - $APPIMAGE_OUTPUT
    expire_in: 1 hour

build_android:
  stage: build
  image: ghcr.io/gmeligio/flutter-android:3.32.5
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - CI_COMMIT_TAG_CLEAN=$(echo $CI_COMMIT_TAG | sed 's/^v//')
    - flutter pub get
  script:
    - flutter build apk --release --build-name=$CI_COMMIT_TAG_CLEAN --build-number=$CI_PIPELINE_IID
  artifacts:
    paths:
      - $APK_OUTPUT
    expire_in: 1 hour

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build_appimage, build_android]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release for tag $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Towdow AppImage"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/$APPIMAGE_OUTPUT"
        - name: "Towdow Android APK"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/$APK_OUTPUT"
