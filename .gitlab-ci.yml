stages:
  - build
  - release

variables:
  APPIMAGE_OUTPUT: "build/linux/x64/release/towdow_app.AppImage"
  APK_OUTPUT: "build/app/outputs/flutter-apk/app-release.apk"
  FLUTTER_VERSION: "3.32.5"

build_appimage:
  stage: build
  image: ubuntu:24.04
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update && apt-get install -y git curl unzip fuse libfuse2 desktop-file-utils ninja-build build-essential cmake clang pkg-config libgtk-3-dev libsecret-1-dev
    - git clone https://github.com/flutter/flutter.git -b ${FLUTTER_VERSION} /usr/local/flutter
    - export PATH="$PATH:/usr/local/flutter/bin"
    - flutter doctor
    - CI_COMMIT_TAG_CLEAN=$(echo $CI_COMMIT_TAG | sed 's/^v//')
  script:
    - bash scripts/linux/build_app_image.sh $CI_COMMIT_TAG_CLEAN $CI_PIPELINE_IID
  artifacts:
    paths:
      - $APPIMAGE_OUTPUT
    expire_in: 1 hour

build_android:
  stage: build
  image: ubuntu:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apt-get update && apt-get install -y git curl unzip openjdk-17-jdk
    - git clone https://github.com/flutter/flutter.git -b ${FLUTTER_VERSION} /usr/local/flutter
    - export PATH="$PATH:/usr/local/flutter/bin"
    - flutter doctor
    - export ANDROID_HOME="/usr/local/android-sdk"
    - mkdir -p $ANDROID_HOME
    - curl -o /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    - unzip /tmp/commandlinetools.zip -d $ANDROID_HOME/cmdline-tools
    - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
    - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
    - yes | sdkmanager --licenses
    - sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
    - CI_COMMIT_TAG_CLEAN=$(echo $CI_COMMIT_TAG | sed 's/^v//')
    - flutter pub get
  script:
    - flutter build apk --release --build-name=$CI_COMMIT_TAG_CLEAN --build-number=$CI_PIPELINE_IID
  artifacts:
    paths:
      - $APK_OUTPUT
    expire_in: 1 hour

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build_appimage, build_android]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release for tag $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Towdow AppImage"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/$APPIMAGE_OUTPUT"
        - name: "Towdow Android APK"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/$APK_OUTPUT"
