stages:
  - prepare
  - build
  - release

variables:
  APPIMAGE_OUTPUT: "build/linux/x64/release/towdow_app.AppImage"
  APK_OUTPUT: "build/app/outputs/flutter-apk/app-release.apk"
  FLUTTER_VERSION: "3.32.5"
  CUSTOM_IMAGE_NAME: "$CI_REGISTRY_IMAGE/flutter-build-env"
  CUSTOM_IMAGE_TAG: "$FLUTTER_VERSION"
  ANDROID_TOOL_VERSION_X: "34"
  ANDROID_TOOL_VERSION: "${ANDROID_TOOL_VERSION_X}.0.0"

build_base_image:
  stage: prepare
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - >
      docker build
      --build-arg FLUTTER_VERSION=$FLUTTER_VERSION
      --build-arg ANDROID_TOOL_VERSION_X=$ANDROID_TOOL_VERSION_X
      --build-arg ANDROID_TOOL_VERSION=$ANDROID_TOOL_VERSION
      -t $CUSTOM_IMAGE_NAME:$CUSTOM_IMAGE_TAG -f CI_scripts/linux/Dockerfile .
    - docker push $CUSTOM_IMAGE_NAME:$CUSTOM_IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - .gitlab-ci.yml
      when: always
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

build_windows_base_image:
  stage: prepare
  image: docker:latest
  tags:
    - windows
  services:
    - docker:dind
  variables:
    WINDOWS_CUSTOM_IMAGE_NAME: "$CI_REGISTRY_IMAGE/flutter-windows-build-env"
    WINDOWS_CUSTOM_IMAGE_TAG: "$FLUTTER_VERSION"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $WINDOWS_CUSTOM_IMAGE_NAME:$WINDOWS_CUSTOM_IMAGE_TAG -f CI_scripts/windows/Dockerfile .
    - docker push $WINDOWS_CUSTOM_IMAGE_NAME:$WINDOWS_CUSTOM_IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - CI_scripts/windows/Dockerfile
      when: always
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

build_appimage:
  stage: build
  image: $CUSTOM_IMAGE_NAME:$CUSTOM_IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "APPIMAGE_JOB_ID=$CI_JOB_ID" > build.env
    - echo "CI_COMMIT_TAG_CLEAN=$CI_COMMIT_TAG_CLEAN" >> build.env
    - echo "CI_PIPELINE_IID=$CI_PIPELINE_IID" >> build.env
    - CI_COMMIT_TAG_CLEAN=$(echo $CI_COMMIT_TAG | sed 's/^v//')
    - bash CI_scripts/linux/build_app_image.sh $CI_COMMIT_TAG_CLEAN $CI_PIPELINE_IID $APPIMAGE_OUTPUT
  artifacts:
    paths:
      - $APPIMAGE_OUTPUT
    expire_in: 1 week
    reports:
      dotenv: build.env

build_android:
  stage: build
  image: $CUSTOM_IMAGE_NAME:$CUSTOM_IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "ANDROID_JOB_ID=$CI_JOB_ID" > build.env
    - CI_COMMIT_TAG_CLEAN=$(echo $CI_COMMIT_TAG | sed 's/^v//')
    - flutter pub get
    - flutter build apk --release --build-name=$CI_COMMIT_TAG_CLEAN --build-number=$CI_PIPELINE_IID
  artifacts:
    paths:
      - $APK_OUTPUT
    expire_in: 1 week
    reports:
      dotenv: build.env

build_windows:
  stage: build
#  image: $WINDOWS_CUSTOM_IMAGE_NAME:$WINDOWS_CUSTOM_IMAGE_TAG
  tags:
    - windows
  rules:
#    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "CI/release_windows"'
      when: always
    - when: never
  script:
    # prevent fatal: detected dubious ownership in repository at 'C:/flutter'
    - git config --global --add safe.directory C:/flutter
    - $env:CI_COMMIT_TAG_CLEAN=$env:CI_COMMIT_TAG -replace '^v', ''
    - flutter pub get
    - flutter build windows --release --build-name=$CI_COMMIT_TAG_CLEAN --build-number=$CI_PIPELINE_IID
    - Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "build/windows/x64/runner/Release/towdow_app-$CI_COMMIT_TAG_CLEAN.zip"
    # now package with Inno bundle to havoid msi paid certificates https://hahouari.medium.com/easy-windows-installers-for-flutter-apps-with-inno-bundle-2ec9b05d2c75
    - dir .\CI_scripts\windows
    - echo "--- Checking network connectivity ---"
    - powershell -Command "Invoke-WebRequest -Uri https://www.google.com -UseBasicParsing -ErrorAction SilentlyContinue | Out-Null; if ($?) { Write-Host 'Network connection successful.' } else { Write-Host 'Network connection failed.' }"
    - echo "--- Checking PATH environment variable ---"
    - powershell -Command "Get-Command winget -ErrorAction SilentlyContinue | Select-Object Path, Version | Format-List"
    - powershell -Command "Get-Item Env:Path | Select-Object Value"
    - echo "--- Running install_winget.ps1 ---"
    - powershell -ExecutionPolicy Bypass -File .\CI_scripts\windows\install_winget.ps1
    - winget install -e --id JRSoftware.InnoSetup --accept-source-agreements --accept-package-agreements
    - dart run inno_bundle:build --release --app-version $CI_COMMIT_TAG_CLEAN --no-gen-app-id --no-gen-publisher --no-app
  artifacts:
    paths:
      - build/windows/x64/runner/Release/towdow_app-*.zip
      - build/windows/x64/installer/Release/TowdowApp-x86_64-$CI_COMMIT_TAG_CLEAN+$CI_PIPELINE_IID-Installer.exe
    expire_in: 1 week

prepare_release:
  stage: build
  image:
    name: alpine/git
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - git fetch origin "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG"
    - git tag -l --format='%(contents)' "$CI_COMMIT_TAG" > release_notes.txt
  artifacts:
    paths:
      - release_notes.txt

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_appimage
      artifacts: true
    - job: build_android
      artifacts: true
    - job: prepare_release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "./release_notes.txt"
    assets:
      links:
        - name: "Towdow AppImage"
          url: "$CI_PROJECT_URL/-/jobs/$APPIMAGE_JOB_ID/artifacts/file/$APPIMAGE_OUTPUT"
        - name: "Towdow Android APK"
          url: "$CI_PROJECT_URL/-/jobs/$ANDROID_JOB_ID/artifacts/file/$APK_OUTPUT"
#        - name: "Towdow Windows Executable"
#          filepath: "build/windows/runner/Release/towdow.exe"
