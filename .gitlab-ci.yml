stages:
  - prepare
  - version
  - test
  - build
  - release

variables:
  FLUTTER_VERSION: "3.35.2"
  CUSTOM_IMAGE_NAME: "$CI_REGISTRY_IMAGE/flutter-build-env"
  CUSTOM_IMAGE_TAG: "$FLUTTER_VERSION"
  ANDROID_TOOL_VERSION_X: "34"
  ANDROID_TOOL_VERSION: "${ANDROID_TOOL_VERSION_X}.0.0"
  FLATPAK_RUNTIME_VERSION: "48"
  FLATPAK_BUILD_IMAGE: "$CI_REGISTRY_IMAGE/build-flatpak"
update_version:
  stage: version
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache yq
  script:
    # Strip leading v from tags like v1.2.3
    - TAG="${CI_COMMIT_TAG#v}"
    # Overwrite pubspec.yaml version
    - yq e -i ".version = \"${TAG}\"" pubspec.yaml
    - echo "Updated pubspec.yaml version to ${TAG}"
    - cat pubspec.yaml | grep "version:"
  artifacts:
    paths:
      - pubspec.yaml
    expire_in: 1 week

