id: app.towdow.TowDow
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: towdow_app
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # GPU acceleration if needed
  - --device=dri
  # Needs to talk to the network:
  - --share=network
  # Needs to save files locally
  - --filesystem=xdg-documents
  # persist local storage
  - -persist=.local/share/towdow
modules:
  - name: TowDow
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/run/build/TowDow/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/TowDow/.pub-cache
    build-commands:
      - dart run build_runner build --delete-conflicting-outputs
      - flutter gen-l10n
      - sed -i "s/0.0.0/__VERSION__/g" "pubspec.yaml"
      - flutter build linux --release --no-pub --build-name=__VERSION__
      - install -D $BUNDLE_PATH/towdow_app /app/bin/towdow_app
      - cp -r $BUNDLE_PATH/lib /app/bin/lib
      - cp -r $BUNDLE_PATH/data /app/bin/data
      - install -Dm644 CI_scripts/linux/flatpak/data/app.towdow.TowDow.desktop /app/share/applications/app.towdow.TowDow.desktop
      - install -Dm644 CI_scripts/linux/flatpak/data/app.towdow.TowDow.metainfo.xml
        /app/share/metainfo/app.towdow.TowDow.metainfo.xml
      - install -Dm644 assets/icons/logo/Flow-it_icon-Default.svg /app/share/icons/hicolor/scalable/apps/app.towdow.TowDow.svg
    sources:
      - type: git
        url: https://gitlab.com/towdow/towdow-flutter.git
        commit: bd6a1a67e76d52d9c1b62103e95bc3143894cac2
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.35.3
        dest: flutter