name: towdow
base: core24
version: '1.2.0'
summary: "Simple to‑do for you. Powerful workflows for your team."
description: |
  A clear task app that stays simple for individuals and scales to small and midsize teams with flexible workflows.

grade: stable
confinement: strict

apps:
  towdow:
    command: bin/launch
    extensions: [gnome]   # Good default for GTK/Flutter-Linux apps
    plugs:
      - network
      - network-bind
      - x11
      - wayland
      - desktop
      - desktop-legacy
      - opengl
      - audio-playback
      - home
      # optional if you need access to USB/SD drives:
      # - removable-media

parts:
  appimage:
    plugin: dump
    source: .
    override-build: |
      set -eux
      # No 'craftctl default' needed if you operate from $CRAFT_PROJECT_DIR
      cp "$CRAFT_PROJECT_DIR/towdow_app-1.2.0.AppImage" "$CRAFT_PART_BUILD/"
      chmod +x "$CRAFT_PART_BUILD/towdow_app-1.2.0.AppImage"
      (cd "$CRAFT_PART_BUILD" && ./towdow_app-1.2.0.AppImage --appimage-extract)
      install -d "$CRAFT_PART_INSTALL/app" "$CRAFT_PART_INSTALL/bin" "$CRAFT_PART_INSTALL/meta/gui"
      cp -a "$CRAFT_PART_BUILD/squashfs-root/." "$CRAFT_PART_INSTALL/app/"
      install -Dm755 -t "$CRAFT_PART_INSTALL/bin" snap/local/launch

