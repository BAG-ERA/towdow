display_name: TowDow
package_name: towdow
maintainer:
  name: TowDow
  email: towdowapp@gmail.com
priority: optional
section: x11
installed_size: 6604
essential: false
icon: assets/icons/logo/Flow-it_icon-Default.png

# Runtime dependencies based on ldd analysis
dependencies:
  # Core GTK3 (brings many dependencies transitively)
  - libgtk-3-0
  - libglib2.0-0
  - libgdk-pixbuf-2.0-0
  # Plugins requirements
  - libsecret-1-0
  - xdg-utils
  # X11 libraries for window management and screen operations
  - libx11-6
  - libxi6
  - libxrandr2
  - libxinerama1
  - libxcursor1
  - libxcomposite1
  - libxdamage1
  - libxfixes3
  - libxext6
  # Graphics and text rendering
  - libcairo2
  - libpango-1.0-0
  - libatk1.0-0
  - libepoxy0
  # Wayland support
  - libwayland-client0
  - libwayland-cursor0
  - libwayland-egl1
  - libxkbcommon0
  # System libraries
  - libblkid1
  - liblzma5

postinstall_scripts:
  - echo "Installed TowDow"
